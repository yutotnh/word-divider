name: "Publish"
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    # The release environment only accepts v* tags and holds the
    # AZURE_CLIENT_ID / AZURE_TENANT_ID secrets.
    environment: release
    permissions:
      contents: write
      id-token: write # for azure/login (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ./.node-version
      - run: yarn install
      # No PAT: Azure DevOps retires global PATs on 2026-12-01, so vsce signs
      # in as a managed identity (a member of the publisher) through OIDC.
      - name: Sign in to Microsoft Entra ID (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish
        run: yarn vscode:publish --azure-credential
      - name: Create package
        run: yarn vscode:package
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
